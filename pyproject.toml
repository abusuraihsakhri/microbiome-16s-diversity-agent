[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "microbiome-16s-diversity-engine"
version = "2.1.0"
description = "Descriptive 16S amplicon count-table diversity analysis and legacy audit utilities"
readme = "README.md"
authors = [{ name = "Abu Suraih Sakhri" }]
license = "MIT"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = ["pydantic>=2,<3"]

[project.optional-dependencies]
server = ["fastapi>=0.110,<1", "uvicorn>=0.29,<1"]
test = ["pytest>=8,<10"]

[project.scripts]
microbiome-16s-diversity-engine = "microbiome_mind.cli:main"
microbiome-diversity = "diversity_cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/microbiome-16s-diversity-agent"
Repository = "https://github.com/abusuraihsakhri/microbiome-16s-diversity-agent"

[tool.setuptools]
packages = ["agents", "microbiome_mind"]
py-modules = ["cli", "diversity_cli", "enrichment", "simulator", "microbiome_mind_app"]
