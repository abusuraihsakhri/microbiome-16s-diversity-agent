[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "microbiome-16s-diversity-engine"
version = "2.0.0"
description = "MicrobiomeMind: Alpha & Beta Diversity (UniFrac / Shannon) Profiler Engine"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security/Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
microbiome-16s-diversity-engine = "microbiome_mind.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/microbiome-16s-diversity-engine"
Repository = "https://github.com/abusuraihsakhri/microbiome-16s-diversity-engine.git"
